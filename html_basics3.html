<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--===========================-->
    <h2> login form</h2>
    <form action="https://www.flipkart.com/" method="GET">
        <!-- USERNAME-->
         <label for="login_username">username:</label><br>
         <input
            type="text"
            id="login_usernmae"
            name="q"
            placeholder="enter username"
            required
            minlength="3"
        >
        <br><br>
        <!-- ================== -->
         <!-- password -->
        
        <label for="login_password">password:</label><br>
         <input
         type="password"
         id="login_password"
         name="password"
         placeholder="Enter password"
         required
         minlength="6"
        >
        <br><br>
    
        
        <!-- submit button-->
         <input type="submit" value="login"> 
    </form>
    <hr>

    
</body>
</html>
